<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Meeting — Teams</title>
    <link rel="stylesheet" href="alert.css" />
  </head>
  <body>
    <main class="alert">
      <p id="when" class="when"></p>
      <h1 id="subject"></h1>
      <p class="meta">
        <span id="time"></span>
        <span id="account" class="account" hidden><span id="account-dot" class="dot"></span><span id="account-name"></span></span>
      </p>
      <div class="actions">
        <button type="button" id="join" class="btn primary">Join</button>
        <button type="button" id="snooze" class="btn">Remind me at start</button>
        <button type="button" id="dismiss" class="btn">Dismiss</button>
      </div>
      <p class="hint">Enter to join · Esc to dismiss</p>
    </main>
    <script src="alert.js"></script>
  </body>
</html>
